<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(100, 200, 255, 0.3),
                        0 0 120px rgba(100, 200, 255, 0.1);
        }

        canvas {
            display: block;
            border-radius: 16px;
        }

        #score-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.5),
                         0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        #score-display.pop {
            transform: translateX(-50%) scale(1.3);
        }

        #ui {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #ui.show {
            opacity: 1;
            pointer-events: auto;
        }

        #ui h1 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        #ui p {
            font-size: 18px;
            opacity: 0.8;
            margin: 5px 0;
        }

        #ui .score-final {
            font-size: 60px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.5);
            margin: 10px 0;
        }

        #ui .best {
            font-size: 16px;
            color: #88d3ce;
        }

        #ui .restart-btn {
            margin-top: 20px;
            padding: 12px 36px;
            font-size: 18px;
            font-weight: bold;
            color: #1a1a2e;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255,215,0,0.4);
        }

        #ui .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(255,215,0,0.6);
        }

        #medal {
            font-size: 50px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="640"></canvas>
        <div id="score-display">0</div>
        <div id="ui">
            <h1>Flappy Bird</h1>
            <p>Click / Space / Tap</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const scoreDisplay = document.getElementById('score-display');

        // Config
        const GRAVITY = 0.45;
        const FLAP = -7.5;
        const PIPE_W = 56;
        const PIPE_GAP = 155;
        const PIPE_SPEED = 3;
        const PIPE_INTERVAL = 95;
        const GROUND_H = 60;

        let bird, pipes, particles, score, best, running, frame, gameOver;
        let bgOffset = 0, groundOffset = 0;
        let clouds = [];

        best = parseInt(localStorage.getItem('flappyBest') || '0');

        // Init clouds
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: 30 + Math.random() * 120,
                w: 60 + Math.random() * 80,
                speed: 0.2 + Math.random() * 0.3
            });
        }

        function init() {
            bird = {
                x: 70, y: canvas.height / 2,
                w: 34, h: 26,
                vy: 0,
                rotation: 0,
                wingFrame: 0
            };
            pipes = [];
            particles = [];
            score = 0;
            running = true;
            gameOver = false;
            frame = 0;
            scoreDisplay.innerText = '0';
            ui.classList.remove('show');
        }

        function flap() {
            if (gameOver) {
                init();
                return;
            }
            if (!running) { init(); return; }
            bird.vy = FLAP;
            // Wing particles
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: bird.x, y: bird.y + bird.h,
                    vx: -1 - Math.random(), vy: 1 + Math.random(),
                    life: 15, size: 3 + Math.random() * 3,
                    color: 'rgba(255,255,255,'
                });
            }
        }

        // Drawing
        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#1a1a4e');
            grad.addColorStop(0.3, '#2d2d6b');
            grad.addColorStop(0.7, '#4a7c8a');
            grad.addColorStop(1, '#70c5ce');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 20; i++) {
                let sx = (i * 137 + 50) % canvas.width;
                let sy = (i * 89 + 20) % 200;
                let twinkle = Math.sin(frame * 0.05 + i) * 0.5 + 0.5;
                ctx.globalAlpha = twinkle * 0.6;
                ctx.beginPath();
                ctx.arc(sx, sy, 1 + twinkle, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Clouds
            clouds.forEach(c => {
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.w * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(c.x - c.w * 0.3, c.y + 5, c.w * 0.6, c.w * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawPipes() {
            pipes.forEach(p => {
                // Top pipe
                let topGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
                topGrad.addColorStop(0, '#1a7a3a');
                topGrad.addColorStop(0.3, '#2ecc40');
                topGrad.addColorStop(0.7, '#27ae36');
                topGrad.addColorStop(1, '#1a7a3a');
                ctx.fillStyle = topGrad;
                ctx.fillRect(p.x, 0, PIPE_W, p.topH);

                // Top cap
                let capGrad = ctx.createLinearGradient(p.x - 4, 0, p.x + PIPE_W + 4, 0);
                capGrad.addColorStop(0, '#1a6a2a');
                capGrad.addColorStop(0.3, '#3ddc50');
                capGrad.addColorStop(0.7, '#2ecc40');
                capGrad.addColorStop(1, '#1a6a2a');
                ctx.fillStyle = capGrad;
                roundRect(p.x - 4, p.topH - 24, PIPE_W + 8, 24, 4);

                // Bottom pipe
                let botY = p.topH + PIPE_GAP;
                ctx.fillStyle = topGrad;
                ctx.fillRect(p.x, botY, PIPE_W, canvas.height - botY - GROUND_H);

                // Bottom cap
                ctx.fillStyle = capGrad;
                roundRect(p.x - 4, botY, PIPE_W + 8, 24, 4);

                // Glow
                ctx.shadowColor = 'rgba(46,204,64,0.3)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'transparent';
            });
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.fill();
        }

        function drawGround() {
            // Ground
            let gGrad = ctx.createLinearGradient(0, canvas.height - GROUND_H, 0, canvas.height);
            gGrad.addColorStop(0, '#8B7355');
            gGrad.addColorStop(0.1, '#c2b280');
            gGrad.addColorStop(1, '#a09060');
            ctx.fillStyle = gGrad;
            ctx.fillRect(0, canvas.height - GROUND_H, canvas.width, GROUND_H);

            // Grass
            let grassGrad = ctx.createLinearGradient(0, canvas.height - GROUND_H, 0, canvas.height - GROUND_H + 15);
            grassGrad.addColorStop(0, '#4a9e4a');
            grassGrad.addColorStop(1, '#2d7a2d');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, canvas.height - GROUND_H, canvas.width, 15);

            // Moving lines
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 2;
            for (let i = 0; i < canvas.width + 40; i += 40) {
                let x = (i - groundOffset) % (canvas.width + 40) - 20;
                ctx.beginPath();
                ctx.moveTo(x, canvas.height - GROUND_H + 15);
                ctx.lineTo(x + 20, canvas.height);
                ctx.stroke();
            }
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
            ctx.rotate(bird.rotation);

            // Glow
            ctx.shadowColor = 'rgba(255,215,0,0.4)';
            ctx.shadowBlur = 15;

            // Body
            let bodyGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, bird.w / 2);
            bodyGrad.addColorStop(0, '#ffe066');
            bodyGrad.addColorStop(0.7, '#ffd700');
            bodyGrad.addColorStop(1, '#f0a500');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Wing (animated)
            let wingAngle = Math.sin(bird.wingFrame * 0.5) * 0.5;
            ctx.save();
            ctx.translate(-4, 2);
            ctx.rotate(wingAngle);
            ctx.fillStyle = '#ffb347';
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(8, -5, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(10, -5, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(11, -6, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(14, 0);
            ctx.lineTo(24, 3);
            ctx.lineTo(14, 7);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color + (p.life / 20) + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / 15), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Update
        function update() {
            frame++;
            bird.wingFrame++;

            // Bird physics
            bird.vy += GRAVITY;
            bird.y += bird.vy;

            // Smooth rotation
            let targetRot = Math.min(Math.max(bird.vy * 0.06, -0.5), 1.2);
            bird.rotation += (targetRot - bird.rotation) * 0.15;

            // Ground
            if (bird.y + bird.h >= canvas.height - GROUND_H) {
                bird.y = canvas.height - GROUND_H - bird.h;
                die();
            }
            if (bird.y <= 0) { bird.y = 0; bird.vy = 0; }

            // Clouds
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.w < 0) { c.x = canvas.width + c.w; c.y = 30 + Math.random() * 120; }
            });

            // Ground scroll
            groundOffset += PIPE_SPEED;

            // Pipes
            if (frame % PIPE_INTERVAL === 0) {
                let topH = 80 + Math.random() * (canvas.height - GROUND_H - PIPE_GAP - 160);
                pipes.push({ x: canvas.width, topH, scored: false });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED;
                if (pipes[i].x + PIPE_W < -10) { pipes.splice(i, 1); continue; }

                let p = pipes[i];
                // Score
                if (!p.scored && p.x + PIPE_W < bird.x) {
                    p.scored = true;
                    score++;
                    scoreDisplay.innerText = score;
                    scoreDisplay.classList.add('pop');
                    setTimeout(() => scoreDisplay.classList.remove('pop'), 150);
                    // Score particles
                    for (let j = 0; j < 8; j++) {
                        particles.push({
                            x: bird.x + bird.w, y: bird.y,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            life: 25, size: 4,
                            color: 'rgba(255,215,0,'
                        });
                    }
                }

                // Collision
                let bx = bird.x + 4, bw = bird.w - 8;
                let by = bird.y + 4, bh = bird.h - 8;
                if (bx + bw > p.x && bx < p.x + PIPE_W &&
                    (by < p.topH || by + bh > p.topH + PIPE_GAP)) {
                    die();
                }
            }
        }

        function die() {
            if (gameOver) return;
            gameOver = true;
            running = false;

            // Death particles
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: bird.x + bird.w/2, y: bird.y + bird.h/2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 40, size: 3 + Math.random() * 4,
                    color: 'rgba(255,100,100,'
                });
            }

            if (score > best) {
                best = score;
                localStorage.setItem('flappyBest', best);
            }

            let medal = score >= 40 ? '🏆' : score >= 20 ? '🥇' : score >= 10 ? '🥈' : score >= 5 ? '🥉' : '';
            setTimeout(() => {
                ui.innerHTML = `
                    <h1>Game Over</h1>
                    <div id="medal">${medal}</div>
                    <div class="score-final">${score}</div>
                    <p class="best">Best: ${best}</p>
                    <button class="restart-btn" onclick="init()">Play Again</button>
                `;
                ui.classList.add('show');
            }, 600);
        }

        // Game Loop
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSky();
            drawPipes();
            drawGround();
            drawBird();
            drawParticles();

            if (running) update();
            else {
                // Still animate particles on death
                drawParticles();
            }
            requestAnimationFrame(loop);
        }

        // Controls
        document.addEventListener('keydown', e => {
            if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flap(); }
        });
        canvas.addEventListener('click', flap);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

        // Start
        init();
        running = false;
        ui.classList.add('show');
        loop();
    </script>
</body>
</html>
